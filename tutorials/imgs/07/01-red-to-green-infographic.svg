<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">红变绿 — 25 条测试的旅程</text>

  <!-- Left: BEFORE -->
  <rect x="30" y="70" width="280" height="430" rx="12" fill="#1a1a2e" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.5"/>
  <text x="170" y="100" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">全部 RED</text>

  <!-- 25 red dots grid -->
  <g fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1">
    <rect x="60" y="120" width="30" height="30" rx="4"/><rect x="105" y="120" width="30" height="30" rx="4"/><rect x="150" y="120" width="30" height="30" rx="4"/><rect x="195" y="120" width="30" height="30" rx="4"/><rect x="240" y="120" width="30" height="30" rx="4"/>
    <rect x="60" y="165" width="30" height="30" rx="4"/><rect x="105" y="165" width="30" height="30" rx="4"/><rect x="150" y="165" width="30" height="30" rx="4"/><rect x="195" y="165" width="30" height="30" rx="4"/><rect x="240" y="165" width="30" height="30" rx="4"/>
    <rect x="60" y="210" width="30" height="30" rx="4"/><rect x="105" y="210" width="30" height="30" rx="4"/><rect x="150" y="210" width="30" height="30" rx="4"/><rect x="195" y="210" width="30" height="30" rx="4"/><rect x="240" y="210" width="30" height="30" rx="4"/>
    <rect x="60" y="255" width="30" height="30" rx="4"/><rect x="105" y="255" width="30" height="30" rx="4"/><rect x="150" y="255" width="30" height="30" rx="4"/><rect x="195" y="255" width="30" height="30" rx="4"/><rect x="240" y="255" width="30" height="30" rx="4"/>
    <rect x="60" y="300" width="30" height="30" rx="4"/><rect x="105" y="300" width="30" height="30" rx="4"/><rect x="150" y="300" width="30" height="30" rx="4"/><rect x="195" y="300" width="30" height="30" rx="4"/><rect x="240" y="300" width="30" height="30" rx="4"/>
  </g>
  <text x="170" y="370" fill="#ef4444" font-size="11" text-anchor="middle">✕ 0 通过</text>
  <text x="170" y="390" fill="#ef4444" font-size="11" text-anchor="middle">✕ 25 失败</text>

  <!-- Middle: PROCESS -->
  <rect x="330" y="70" width="300" height="430" rx="12" fill="#0a1628" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <text x="480" y="100" fill="#3b82f6" font-size="14" font-weight="700" text-anchor="middle">逐条变绿</text>

  <rect x="360" y="130" width="240" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="150" fill="#60a5fa" font-size="10" text-anchor="middle">改一个文件</text>
  <text x="480" y="167" fill="#60a5fa" font-size="10" text-anchor="middle">跑一次测试</text>

  <line x1="480" y1="175" x2="480" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="205" width="240" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="225" fill="#86efac" font-size="10" text-anchor="middle">✅ 一个测试变绿</text>
  <text x="480" y="242" fill="#86efac" font-size="10" text-anchor="middle">✅ 再改下一个</text>

  <line x1="480" y1="250" x2="480" y2="275" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="280" width="240" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="300" fill="#60a5fa" font-size="10" text-anchor="middle">重复 5 次</text>
  <text x="480" y="317" fill="#60a5fa" font-size="10" text-anchor="middle">每次 2 分钟反馈</text>

  <text x="480" y="400" fill="#22d3ee" font-size="10" text-anchor="middle">最小步进</text>
  <text x="480" y="420" fill="#22d3ee" font-size="10" text-anchor="middle">红 → 绿 → 红 → 绿 → ...</text>

  <!-- Arrow → -->
  <path d="M 630 285 Q 660 285 660 240 Q 660 195 690 195" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: AFTER -->
  <rect x="700" y="70" width="230" height="430" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22c55e" stroke-width="1.5"/>
  <text x="815" y="100" fill="#22c55e" font-size="14" font-weight="700" text-anchor="middle">全部 GREEN</text>

  <g fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="1">
    <rect x="720" y="120" width="30" height="30" rx="4"/><rect x="765" y="120" width="30" height="30" rx="4"/><rect x="810" y="120" width="30" height="30" rx="4"/><rect x="855" y="120" width="30" height="30" rx="4"/><rect x="890" y="120" width="30" height="30" rx="4"/>
    <rect x="720" y="165" width="30" height="30" rx="4"/><rect x="765" y="165" width="30" height="30" rx="4"/><rect x="810" y="165" width="30" height="30" rx="4"/><rect x="855" y="165" width="30" height="30" rx="4"/><rect x="890" y="165" width="30" height="30" rx="4"/>
    <rect x="720" y="210" width="30" height="30" rx="4"/><rect x="765" y="210" width="30" height="30" rx="4"/><rect x="810" y="210" width="30" height="30" rx="4"/><rect x="855" y="210" width="30" height="30" rx="4"/><rect x="890" y="210" width="30" height="30" rx="4"/>
    <rect x="720" y="255" width="30" height="30" rx="4"/><rect x="765" y="255" width="30" height="30" rx="4"/><rect x="810" y="255" width="30" height="30" rx="4"/><rect x="855" y="255" width="30" height="30" rx="4"/><rect x="890" y="255" width="30" height="30" rx="4"/>
    <rect x="720" y="300" width="30" height="30" rx="4"/><rect x="765" y="300" width="30" height="30" rx="4"/><rect x="810" y="300" width="30" height="30" rx="4"/><rect x="855" y="300" width="30" height="30" rx="4"/><rect x="890" y="300" width="30" height="30" rx="4"/>
  </g>
  <text x="815" y="370" fill="#22c55e" font-size="11" text-anchor="middle">✅ 25 通过</text>
  <text x="815" y="390" fill="#22c55e" font-size="11" text-anchor="middle">✅ 0 失败</text>
</svg>