<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">Mock 隔离 — 测试只测业务逻辑</text>

  <rect x="60" y="80" width="400" height="420" rx="10" fill="#1a1a2e" fill-opacity="0.4" stroke="#ef4444" stroke-width="1"/>
  <text x="260" y="110" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle">没有 Mock</text>
  <text x="260" y="135" fill="#fca5a5" font-size="10" text-anchor="middle">测试需要依赖</text>
  <rect x="100" y="160" width="320" height="40" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="260" y="185" fill="#9ca3af" font-size="10" text-anchor="middle">🗄️ 启动数据库</text>
  <rect x="100" y="215" width="320" height="40" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="260" y="240" fill="#9ca3af" font-size="10" text-anchor="middle">👤 插入测试用户</text>
  <rect x="100" y="270" width="320" height="40" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="260" y="295" fill="#9ca3af" font-size="10" text-anchor="middle">🔑 配置 JWT 密钥</text>
  <rect x="100" y="325" width="320" height="40" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="260" y="350" fill="#fca5a5" font-size="10" text-anchor="middle">⏱️ 测试跑一次 ≈ 5 秒</text>
  <text x="260" y="440" fill="#ef4444" font-size="10" text-anchor="middle">依赖太多，测试脆弱</text>

  <text x="480" y="290" fill="#22d3ee" font-size="28" font-weight="700" text-anchor="middle" filter="url(#glow)">VS</text>

  <rect x="500" y="80" width="420" height="420" rx="10" fill="#0a1628" fill-opacity="0.6" stroke="#22c55e" stroke-width="1.5"/>
  <text x="710" y="110" fill="#22c55e" font-size="13" font-weight="700" text-anchor="middle">有 Mock</text>
  <text x="710" y="135" fill="#86efac" font-size="10" text-anchor="middle">测试只测"登录的逻辑"</text>

  <rect x="540" y="160" width="340" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="710" y="185" fill="#60a5fa" font-size="10" text-anchor="middle">🔲 mockUserModel.findByUsername</text>
  <rect x="540" y="215" width="340" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="710" y="240" fill="#60a5fa" font-size="10" text-anchor="middle">🔲 mockPassword.verifyPassword</text>
  <rect x="540" y="270" width="340" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="710" y="295" fill="#60a5fa" font-size="10" text-anchor="middle">🔲 mockJwt.signToken</text>
  <rect x="540" y="325" width="340" height="40" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="710" y="350" fill="#86efac" font-size="10" text-anchor="middle">⚡ 测试跑一次 ≈ 0.1 秒</text>
  <text x="710" y="440" fill="#22c55e" font-size="10" text-anchor="middle">只测业务逻辑，不依赖外部</text>
</svg>