<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">反馈循环对比</text>

  <!-- Left: 长循环 -->
  <rect x="40" y="70" width="400" height="430" rx="12" fill="#1a1a2e" fill-opacity="0.4" stroke="#ef4444" stroke-width="1"/>
  <text x="240" y="100" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">长循环（写完全部再测）</text>

  <rect x="80" y="130" width="320" height="35" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="152" fill="#9ca3af" font-size="11" text-anchor="middle">写 2 小时代码</text>
  <line x1="240" y1="165" x2="240" y2="185" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="80" y="190" width="320" height="35" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="212" fill="#9ca3af" font-size="11" text-anchor="middle">跑测试 1 分钟</text>
  <line x1="240" y1="225" x2="240" y2="245" stroke="#ef4444" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="80" y="250" width="320" height="35" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="272" fill="#fca5a5" font-size="11" text-anchor="middle">❌ 11 个测试失败</text>
  <line x1="240" y1="285" x2="240" y2="305" stroke="#ef4444" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="80" y="310" width="320" height="35" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="332" fill="#fca5a5" font-size="11" text-anchor="middle">🔍 定位 30 分钟</text>
  <line x1="240" y1="345" x2="240" y2="365" stroke="#ef4444" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="80" y="370" width="320" height="35" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="392" fill="#fca5a5" font-size="11" text-anchor="middle">❌ 又发现 3 个新失败</text>

  <text x="240" y="460" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">整个下午</text>

  <!-- Center VS -->
  <text x="480" y="280" fill="#22d3ee" font-size="28" font-weight="700" text-anchor="middle" filter="url(#glow)">VS</text>

  <!-- Right: 短循环 -->
  <rect x="520" y="70" width="400" height="430" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="100" fill="#22c55e" font-size="14" font-weight="700" text-anchor="middle">短循环（每次改一个文件）</text>

  <rect x="560" y="130" width="320" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="152" fill="#86efac" font-size="11" text-anchor="middle">✅ 改 authService.js（2 分钟）</text>
  <line x1="720" y1="165" x2="720" y2="185" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="190" width="320" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="212" fill="#86efac" font-size="11" text-anchor="middle">✅ 跑测试（1 秒）→ 绿了</text>
  <line x1="720" y1="225" x2="720" y2="245" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="250" width="320" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="272" fill="#86efac" font-size="11" text-anchor="middle">✅ 改 controller.js（3 分钟）</text>
  <line x1="720" y1="285" x2="720" y2="305" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="310" width="320" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="332" fill="#86efac" font-size="11" text-anchor="middle">✅ 跑测试（1 秒）→ 绿了</text>
  <line x1="720" y1="345" x2="720" y2="365" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="370" width="320" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="392" fill="#86efac" font-size="11" text-anchor="middle">✅ 全部通过（x5 次循环）</text>

  <text x="720" y="460" fill="#22c55e" font-size="12" font-weight="700" text-anchor="middle">半小时</text>

  <text x="480" y="520" fill="#22d3ee" font-size="11" text-anchor="middle" filter="url(#glow)">反馈速度 = 开发效率</text>
</svg>