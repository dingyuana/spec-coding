<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">三文件脚手架</text>

  <!-- Center label -->
  <text x="480" y="280" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle" filter="url(#glow)">项目脚手架</text>

  <!-- Node 1: package.json (top) -->
  <rect x="340" y="80" width="280" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="340" y="80" width="280" height="28" rx="10" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="480" y="100" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">📦 package.json</text>
  <text x="480" y="130" fill="#94a3b8" font-size="10" text-anchor="middle">统一入口</text>
  <text x="480" y="150" fill="#6b7280" font-size="9" text-anchor="middle">npm install / npm run dev / npm test</text>

  <!-- Node 2: .env (bottom left) -->
  <rect x="80" y="340" width="280" height="90" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <rect x="80" y="340" width="280" height="28" rx="10" fill="#60a5fa" fill-opacity="0.15"/>
  <text x="220" y="360" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">🔑 .env</text>
  <text x="220" y="390" fill="#94a3b8" font-size="10" text-anchor="middle">配置分离</text>
  <text x="220" y="410" fill="#6b7280" font-size="9" text-anchor="middle">密钥从环境变量读取</text>

  <!-- Node 3: .gitignore (bottom right) -->
  <rect x="600" y="340" width="280" height="90" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <rect x="600" y="340" width="280" height="28" rx="10" fill="#22d3ee" fill-opacity="0.15"/>
  <text x="740" y="360" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">🛡️ .gitignore</text>
  <text x="740" y="390" fill="#94a3b8" font-size="10" text-anchor="middle">安全防线</text>
  <text x="740" y="410" fill="#6b7280" font-size="9" text-anchor="middle">阻止 node_modules + .env 提交</text>

  <!-- Triangle connections -->
  <line x1="480" y1="170" x2="220" y2="340" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="480" y1="170" x2="740" y2="340" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="360" y1="340" x2="600" y2="340" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>
</svg>