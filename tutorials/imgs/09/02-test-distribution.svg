<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">30 条测试分布图</text>

  <!-- 6 bars -->
  <rect x="100" y="80" width="760" height="55" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="105" fill="#3b82f6" font-size="11" font-weight="700">errors.test.js</text>
  <text x="120" y="122" fill="#6b7280" font-size="8">错误类构造 + 预定义错误码</text>
  <rect x="680" y="93" width="160" height="30" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <text x="760" y="113" fill="#3b82f6" font-size="10" font-weight="600" text-anchor="middle">6 条</text>

  <rect x="100" y="145" width="760" height="55" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="170" fill="#22d3ee" font-size="11" font-weight="700">password.test.js</text>
  <text x="120" y="187" fill="#6b7280" font-size="8">bcrypt 哈希 + 边界条件</text>
  <rect x="720" y="158" width="120" height="30" rx="4" fill="#22d3ee" fill-opacity="0.3" stroke="#22d3ee" stroke-width="1"/>
  <text x="780" y="178" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">4 条</text>

  <rect x="100" y="210" width="760" height="55" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="120" y="235" fill="#60a5fa" font-size="11" font-weight="700">jwt.test.js</text>
  <text x="120" y="252" fill="#6b7280" font-size="8">JWT 签发 + payload + 验证</text>
  <rect x="740" y="223" width="100" height="30" rx="4" fill="#60a5fa" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1"/>
  <text x="790" y="243" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">3 条</text>

  <rect x="100" y="275" width="760" height="55" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="120" y="300" fill="#a78bfa" font-size="11" font-weight="700">userModel.test.js</text>
  <text x="120" y="317" fill="#6b7280" font-size="8">增删查 + 存在/不存在</text>
  <rect x="700" y="288" width="140" height="30" rx="4" fill="#a78bfa" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1"/>
  <text x="770" y="308" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">5 条</text>

  <rect x="100" y="340" width="760" height="55" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="365" fill="#fbbf24" font-size="11" font-weight="700">authService.test.js</text>
  <text x="120" y="382" fill="#6b7280" font-size="8">登录成功 + 密码错误 + 用户不存在</text>
  <rect x="720" y="353" width="120" height="30" rx="4" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
  <text x="780" y="373" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">3 条</text>

  <rect x="100" y="405" width="760" height="55" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="430" fill="#86efac" font-size="11" font-weight="700">auth.test.js（集成测试）</text>
  <text x="120" y="447" fill="#6b7280" font-size="8">4 个 Scenario，完整 HTTP 路径</text>
  <rect x="630" y="418" width="210" height="30" rx="4" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5"/>
  <text x="735" y="438" fill="#22c55e" font-size="10" font-weight="700" text-anchor="middle">8 条</text>

  <rect x="300" y="485" width="360" height="35" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
  <text x="480" y="508" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">总计：6 suites | 30 tests ✅</text>
</svg>