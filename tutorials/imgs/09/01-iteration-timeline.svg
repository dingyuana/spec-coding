<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">6 个迭代 — 从零到三十通过</text>

  <!-- Timeline -->
  <line x1="60" y1="280" x2="900" y2="280" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>

  <circle cx="70" cy="280" r="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="70" y="285" fill="#3b82f6" font-size="9" font-weight="700" text-anchor="middle">0</text>
  <text x="70" y="260" fill="#3b82f6" font-size="8" text-anchor="middle">工程</text>

  <circle cx="210" cy="280" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="210" y="285" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="210" y="260" fill="#22d3ee" font-size="8" text-anchor="middle">工具</text>

  <circle cx="350" cy="280" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="350" y="285" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="350" y="260" fill="#22d3ee" font-size="8" text-anchor="middle">模型</text>

  <circle cx="490" cy="280" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="490" y="285" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">3</text>
  <text x="490" y="260" fill="#22d3ee" font-size="8" text-anchor="middle">服务</text>

  <circle cx="630" cy="280" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="630" y="285" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">4</text>
  <text x="630" y="260" fill="#22d3ee" font-size="8" text-anchor="middle">接口</text>

  <circle cx="800" cy="280" r="20" fill="#0f172a" stroke="#22c55e" stroke-width="2.5" filter="url(#glow)"/>
  <text x="800" y="285" fill="#22c55e" font-size="9" font-weight="700" text-anchor="middle">5</text>
  <text x="800" y="260" fill="#22c55e" font-size="8" text-anchor="middle">验证</text>

  <!-- Test counts -->
  <rect x="40" y="310" width="60" height="30" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="70" y="330" fill="#3b82f6" font-size="9" text-anchor="middle">0</text>

  <rect x="180" y="310" width="60" height="30" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="210" y="330" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">13</text>

  <rect x="320" y="310" width="60" height="30" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="350" y="330" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">18</text>

  <rect x="460" y="310" width="60" height="30" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="490" y="330" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">21</text>

  <rect x="600" y="310" width="60" height="30" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="630" y="330" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">30</text>

  <rect x="770" y="310" width="60" height="30" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="800" y="330" fill="#22c55e" font-size="9" font-weight="700" text-anchor="middle">30</text>

  <text x="480" y="400" fill="#22d3ee" font-size="11" text-anchor="middle" filter="url(#glow)">测试计数从 0 增长到 30，全程绿色</text>
  <text x="480" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">每个 Iter 结束时，新增的测试全部通过，不走回头路</text>

  <rect x="200" y="450" width="560" height="40" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="475" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">最终：6 suites | 30 passed | 30 total ✅</text>
</svg>