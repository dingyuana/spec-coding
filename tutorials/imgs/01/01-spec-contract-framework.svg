<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">SPEC 契约模型</text>

  <rect x="180" y="70" width="600" height="440" rx="12" fill="#0a1628" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>

  <!-- Layer 1: 需求 -->
  <rect x="280" y="100" width="400" height="70" rx="8" fill="#0f172a" stroke="#1a3a6a" stroke-width="2"/>
  <text x="480" y="135" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="middle">💬 产品需求</text>
  <text x="480" y="155" fill="#6b7280" font-size="10" text-anchor="middle">"用户要能登录"</text>

  <line x1="480" y1="170" x2="480" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/></marker>

  <!-- Layer 2: SPEC (highlighted) -->
  <rect x="230" y="215" width="500" height="100" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="230" y="215" width="500" height="28" rx="10" fill="#22d3ee" fill-opacity="0.15"/>
  <text x="480" y="245" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="middle">📜 SPEC.md 契约</text>
  <text x="480" y="272" fill="#94a3b8" font-size="10" text-anchor="middle">POST /api/auth/login → 200 { token }</text>
  <text x="480" y="290" fill="#94a3b8" font-size="10" text-anchor="middle">密码错误 → 401 { error: "用户名或密码错误" }</text>
  <text x="480" y="308" fill="#94a3b8" font-size="10" text-anchor="middle">白纸黑字，不可争议</text>

  <line x1="480" y1="315" x2="480" y2="355" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow2)"/>
  <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>

  <!-- Layer 3: 代码 + 测试 -->
  <rect x="280" y="360" width="400" height="70" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="392" fill="#86efac" font-size="14" font-weight="600" text-anchor="middle">⚙️ 实现 + 验证</text>
  <text x="480" y="412" fill="#6b7280" font-size="10" text-anchor="middle">测试守护契约，25 条断言全部通过 ✅</text>

  <!-- Bidirectional arrow between SPEC and Code -->
  <path d="M 730 265 L 770 265 L 770 395 L 730 395" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="790" y="340" fill="#22d3ee" font-size="9" fill-opacity="0.7">验证</text>
</svg>