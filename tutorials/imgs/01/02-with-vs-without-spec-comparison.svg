<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">有 SPEC vs 无 SPEC</text>

  <!-- Left: 无 SPEC -->
  <rect x="40" y="70" width="400" height="430" rx="12" fill="#1a1a2e" fill-opacity="0.4" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="100" fill="#9ca3af" font-size="14" font-weight="700" text-anchor="middle">没有 SPEC</text>
  <text x="240" y="120" fill="#6b7280" font-size="10" text-anchor="middle">一切靠口头传递</text>

  <rect x="80" y="150" width="320" height="45" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="177" fill="#9ca3af" font-size="11" text-anchor="middle">🔍 翻代码找接口定义</text>
  <rect x="80" y="210" width="320" height="45" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="237" fill="#9ca3af" font-size="11" text-anchor="middle">💬 问同事："返回格式是什么？"</text>
  <rect x="80" y="270" width="320" height="45" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="297" fill="#9ca3af" font-size="11" text-anchor="middle">📝 口头约定，三个月后失效</text>
  <rect x="80" y="330" width="320" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="240" y="357" fill="#fca5a5" font-size="11" text-anchor="middle">⚠️ 接口改了，没人通知</text>

  <text x="240" y="440" fill="#6b7280" font-size="11" text-anchor="middle">"我记得你当时说……"</text>
  <text x="240" y="460" fill="#6b7280" font-size="11" text-anchor="middle">—— 项目日常</text>

  <!-- Center divider -->
  <line x1="440" y1="80" x2="440" y2="500" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3"/>
  <text x="480" y="290" fill="#22d3ee" font-size="28" font-weight="700" text-anchor="middle" filter="url(#glow)">VS</text>

  <!-- Right: 有 SPEC -->
  <rect x="520" y="70" width="400" height="430" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="720" y="100" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">有 SPEC</text>
  <text x="720" y="120" fill="#22d3ee" font-size="10" text-anchor="middle" fill-opacity="0.7">一切以契约为准</text>

  <rect x="560" y="150" width="320" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="177" fill="#60a5fa" font-size="11" text-anchor="middle">📖 读 SPEC，一目了然</text>
  <rect x="560" y="210" width="320" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="237" fill="#60a5fa" font-size="11" text-anchor="middle">✅ 跑测试，自动验证</text>
  <rect x="560" y="270" width="320" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="297" fill="#60a5fa" font-size="11" text-anchor="middle">🔒 契约验证，自动守护</text>
  <rect x="560" y="330" width="320" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="357" fill="#86efac" font-size="11" text-anchor="middle">✅ 接口改了，测试先红</text>

  <text x="720" y="440" fill="#22d3ee" font-size="11" text-anchor="middle">"SPEC 第 4 条写了"</text>
  <text x="720" y="460" fill="#22d3ee" font-size="11" text-anchor="middle">—— 项目日常</text>
</svg>