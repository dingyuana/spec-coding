<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">外挂大脑——认知卸载</text>

  <!-- Left: 大脑负载 -->
  <rect x="40" y="70" width="400" height="430" rx="12" fill="#1a1a2e" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="100" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">🧠 大脑负载</text>

  <rect x="80" y="130" width="320" height="45" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="157" fill="#fbbf24" font-size="11" text-anchor="middle">记住所有任务</text>
  <rect x="80" y="190" width="320" height="45" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="217" fill="#fbbf24" font-size="11" text-anchor="middle">记住每个依赖关系</text>
  <rect x="80" y="250" width="320" height="45" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="277" fill="#fbbf24" font-size="11" text-anchor="middle">记住谁做完了谁没做</text>
  <rect x="80" y="310" width="320" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="337" fill="#fca5a5" font-size="11" text-anchor="middle">❌ 5 个线程同时跑 → 卡住</text>

  <text x="240" y="430" fill="#fbbf24" font-size="11" text-anchor="middle">"我今天要做什么来着？"</text>
  <text x="240" y="450" fill="#fbbf24" font-size="11" text-anchor="middle">—— 每天花 15 分钟回忆</text>

  <!-- Arrow -->
  <line x1="440" y1="285" x2="490" y2="285" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="270" fill="#22d3ee" font-size="9" text-anchor="middle">卸载</text>

  <!-- Right: 外挂 PLAN -->
  <rect x="520" y="70" width="400" height="430" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="720" y="100" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">📋 外挂 PLAN</text>

  <rect x="560" y="130" width="320" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="157" fill="#60a5fa" font-size="11" text-anchor="middle">看 PLAN → 找第一个 ⬜</text>
  <rect x="560" y="190" width="320" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="217" fill="#60a5fa" font-size="11" text-anchor="middle">执行 → 勾 ✅</text>
  <rect x="560" y="250" width="320" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="277" fill="#60a5fa" font-size="11" text-anchor="middle">看 PLAN → 下一个 ⬜</text>
  <rect x="560" y="310" width="320" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="337" fill="#86efac" font-size="11" text-anchor="middle">✅ 1 个线程，不卡了</text>

  <text x="720" y="430" fill="#22d3ee" font-size="11" text-anchor="middle">"PLAN 说下一步是写测试"</text>
  <text x="720" y="450" fill="#22d3ee" font-size="11" text-anchor="middle">—— 直接开工，不用回忆</text>
</svg>