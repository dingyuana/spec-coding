  <text x="480" y="290" fill="#22d3ee" font-size="28" font-weight="700" text-anchor="middle" filter="url(#glow)">→</text>

  <rect x="510" y="80" width="410" height="420" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.5"/>
