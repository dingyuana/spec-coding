  <path d="M 350 295 Q 350 375 250 375" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <path d="M 250 375 Q 150 375 150 295" fill="none" stroke="#ef4444" stroke-width="1.5"/>
