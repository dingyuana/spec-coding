<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">幂等性：跑多少次都一样</text>

  <rect x="60" y="80" width="260" height="180" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="110" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">第 1 次运行</text>
  <rect x="100" y="130" width="180" height="35" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="190" y="152" fill="#94a3b8" font-size="10" text-anchor="middle">admin 不存在</text>
  <line x1="190" y1="165" x2="190" y2="185" stroke="#22d3ee" stroke-width="1.5"/>
  <polygon points="185,185 195,185 190,193" fill="#22d3ee"/>
  <rect x="100" y="195" width="180" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="190" y="217" fill="#86efac" font-size="10" text-anchor="middle">✅ 创建 admin</text>
  <text x="190" y="245" fill="#22c55e" font-size="9" text-anchor="middle">→ 用户已创建</text>

  <text x="370" y="170" fill="#22d3ee" font-size="22" font-weight="700" text-anchor="middle">→</text>

  <rect x="420" y="80" width="260" height="180" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="110" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">第 2 次运行</text>
  <rect x="460" y="130" width="180" height="35" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="550" y="152" fill="#94a3b8" font-size="10" text-anchor="middle">admin 已存在</text>
  <line x1="550" y1="165" x2="550" y2="185" stroke="#22d3ee" stroke-width="1.5"/>
  <polygon points="545,185 555,185 550,193" fill="#22d3ee"/>
  <rect x="460" y="195" width="180" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="550" y="217" fill="#86efac" font-size="10" text-anchor="middle">✅ 跳过（无操作）</text>
  <text x="550" y="245" fill="#22c55e" font-size="9" text-anchor="middle">→ 状态不变</text>

  <text x="730" y="170" fill="#22d3ee" font-size="22" font-weight="700" text-anchor="middle">→</text>

  <rect x="770" y="80" width="150" height="180" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="845" y="110" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">第 N 次</text>
  <rect x="785" y="130" width="120" height="35" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="845" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">♾️ 检查→跳过</text>
  <rect x="785" y="195" width="120" height="35" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="845" y="217" fill="#22d3ee" font-size="9" text-anchor="middle">保持稳定</text>

  <rect x="100" y="330" width="760" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="480" y="358" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">幂等性：跑 1 次和跑 100 次结果一样</text>
  <text x="480" y="378" fill="#94a3b8" font-size="10" text-anchor="middle">不会报错、不会重复、不会副作用</text>
</svg>