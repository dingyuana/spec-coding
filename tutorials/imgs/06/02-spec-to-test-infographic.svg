<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">验收标准 → 自动化</text>

  <!-- Layer 1: SPEC -->
  <rect x="180" y="80" width="600" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="180" y="80" width="600" height="30" rx="10" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="480" y="100" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">📄 SPEC — 人类可读</text>
  <text x="480" y="135" fill="#94a3b8" font-size="11" text-anchor="middle">Scenario 2: 密码错误 → 返回 401 { error: "用户名或密码错误" }</text>
  <text x="480" y="155" fill="#6b7280" font-size="9" text-anchor="middle">写在 Markdown 里，人人都能看懂</text>

  <line x1="480" y1="170" x2="480" y2="210" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: 测试 -->
  <rect x="180" y="215" width="600" height="90" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="180" y="215" width="600" height="30" rx="10" fill="#22d3ee" fill-opacity="0.15"/>
  <text x="480" y="235" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">🧪 测试 — 机器可执行</text>
  <text x="480" y="268" fill="#94a3b8" font-size="10" text-anchor="middle">expect(res.status).toBe(401);</text>
  <text x="480" y="285" fill="#94a3b8" font-size="10" text-anchor="middle">expect(res.body.error).toBe("用户名或密码错误");</text>
  <text x="480" y="298" fill="#6b7280" font-size="9" text-anchor="middle">写在 Jest 里，npm test 自动执行</text>

  <line x1="480" y1="305" x2="480" y2="345" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: 代码 -->
  <rect x="180" y="350" width="600" height="90" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <rect x="180" y="350" width="600" height="30" rx="10" fill="#22c55e" fill-opacity="0.15"/>
  <text x="480" y="370" fill="#22c55e" font-size="12" font-weight="700" text-anchor="middle">⚙️ 代码 — 验证实现</text>
  <text x="480" y="405" fill="#94a3b8" font-size="10" text-anchor="middle">ctx.status = 401; ctx.body = { error: "用户名或密码错误" };</text>
  <text x="480" y="425" fill="#6b7280" font-size="9" text-anchor="middle">测试通过 = 代码符合 SPEC</text>

  <!-- Right side annotation -->
  <path d="M 780 260 L 840 260 L 840 130 L 780 130" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="860" y="200" fill="#22d3ee" font-size="10" text-anchor="middle" transform="rotate(90, 860, 200)">自动化守护</text>
</svg>