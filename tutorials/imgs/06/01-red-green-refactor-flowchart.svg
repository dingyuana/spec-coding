<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">RED-GREEN-REFACTOR 循环</text>

  <!-- RED circle -->
  <circle cx="240" cy="220" r="110" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
  <circle cx="240" cy="220" r="110" fill="#ef4444" fill-opacity="0.05"/>
  <text x="240" y="190" fill="#ef4444" font-size="22" font-weight="700" text-anchor="middle">✕</text>
  <text x="240" y="215" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">RED</text>
  <text x="240" y="240" fill="#fca5a5" font-size="11" text-anchor="middle">写失败的测试</text>
  <text x="240" y="260" fill="#fca5a5" font-size="10" text-anchor="middle">25 条测试 → 25 条红色</text>

  <!-- Arrow RED → GREEN -->
  <path d="M 350 220 Q 420 170 470 220" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GREEN circle -->
  <circle cx="600" cy="220" r="110" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <circle cx="600" cy="220" r="110" fill="#22c55e" fill-opacity="0.05"/>
  <text x="600" y="190" fill="#22c55e" font-size="22" font-weight="700" text-anchor="middle">✓</text>
  <text x="600" y="215" fill="#22c55e" font-size="14" font-weight="700" text-anchor="middle">GREEN</text>
  <text x="600" y="240" fill="#86efac" font-size="11" text-anchor="middle">写最少的代码</text>
  <text x="600" y="260" fill="#86efac" font-size="10" text-anchor="middle">让测试通过</text>

  <!-- Arrow GREEN → REFACTOR -->
  <path d="M 600 330 Q 600 400 480 400 Q 360 400 360 330" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- REFACTOR at bottom -->
  <circle cx="480" cy="420" r="50" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="480" cy="420" r="50" fill="#3b82f6" fill-opacity="0.1"/>
  <text x="480" y="415" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">REFACTOR</text>
  <text x="480" y="435" fill="#60a5fa" font-size="9" text-anchor="middle">优化代码</text>

  <!-- Arrow REFACTOR → RED (loop) -->
  <path d="M 430 420 Q 240 420 240 330" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <text x="480" y="510" fill="#22d3ee" font-size="11" text-anchor="middle" filter="url(#glow)">RED → GREEN → REFACTOR → RED → ... 每次循环代码更健壮</text>
</svg>