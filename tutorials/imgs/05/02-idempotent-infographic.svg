<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">幂等性 — 跑多少次都一样</text>

  <!-- Frame 1: 第一次 -->
  <rect x="60" y="80" width="260" height="200" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="110" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">第 1 次运行</text>
  <rect x="100" y="130" width="180" height="40" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="190" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">admin 不存在</text>
  <line x1="190" y1="170" x2="190" y2="190" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="100" y="195" width="180" height="40" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="190" y="220" fill="#86efac" font-size="10" text-anchor="middle">✅ 创建用户</text>

  <text x="190" y="260" fill="#22c55e" font-size="10" text-anchor="middle">结果：用户已创建</text>

  <!-- Arrow → -->
  <line x1="320" y1="180" x2="370" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame 2: 第二次 -->
  <rect x="380" y="80" width="260" height="200" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="510" y="110" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">第 2 次运行</text>
  <rect x="420" y="130" width="180" height="40" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
  <text x="510" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">admin 已存在</text>
  <line x1="510" y1="170" x2="510" y2="190" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="195" width="180" height="40" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="220" fill="#86efac" font-size="10" text-anchor="middle">✅ 跳过（无操作）</text>

  <text x="510" y="260" fill="#22c55e" font-size="10" text-anchor="middle">结果：状态不变</text>

  <!-- Arrow → -->
  <line x1="640" y1="180" x2="690" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame 3: 第N次 -->
  <rect x="700" y="80" width="220" height="200" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="810" y="110" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">第 N 次运行</text>
  <rect x="720" y="130" width="180" height="40" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="810" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">检查 → 跳过 → ✅</text>
  <line x1="810" y1="170" x2="810" y2="190" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="720" y="195" width="180" height="40" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="810" y="220" fill="#22d3ee" font-size="10" text-anchor="middle">♾️ 保持稳定</text>

  <text x="810" y="260" fill="#22d3ee" font-size="10" text-anchor="middle">结果：完全一致</text>

  <!-- Bottom summary -->
  <rect x="160" y="320" width="640" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="480" y="348" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">幂等性：跑 1 次和跑 100 次结果一样</text>
  <text x="480" y="368" fill="#94a3b8" font-size="10" text-anchor="middle">不会报错、不会重复、不会副作用</text>

  <text x="480" y="430" fill="#94a3b8" font-size="10" text-anchor="middle">🚀 开发环境、CI 环境、测试环境 — 每次初始化都安全</text>
</svg>