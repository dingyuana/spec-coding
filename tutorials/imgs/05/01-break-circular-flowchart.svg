<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">打破循环依赖</text>

  <!-- Left: 循环依赖 -->
  <rect x="40" y="70" width="400" height="430" rx="12" fill="#1a1a2e" fill-opacity="0.4" stroke="#ef4444" stroke-width="1"/>
  <text x="240" y="100" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">循环依赖</text>
  <text x="240" y="120" fill="#fca5a5" font-size="10" text-anchor="middle">"鸡生蛋，蛋生鸡"</text>

  <circle cx="240" cy="220" r="30" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="225" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">注册</text>
  <circle cx="360" cy="300" r="30" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="305" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">登录</text>
  <circle cx="120" cy="300" r="30" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="305" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">用户</text>
  <circle cx="240" cy="380" r="30" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="385" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">测试</text>

  <!-- Circular arrows -->
  <path d="M 240 190 Q 360 190 360 270" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 360 330 Q 360 410 240 410" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 240 410 Q 120 410 120 330" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 120 270 Q 120 190 240 190" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="240" y="460" fill="#ef4444" font-size="11" text-anchor="middle">绕不出去，无法开始</text>

  <!-- Right: 种子打破 -->
  <rect x="520" y="70" width="400" height="430" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="720" y="100" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">种子打破循环</text>

  <rect x="580" y="130" width="280" height="45" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="720" y="158" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">🌱 种子脚本</text>

  <line x1="720" y1="175" x2="720" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="205" width="280" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="233" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">👤 预置 admin 用户</text>

  <line x1="720" y1="250" x2="720" y2="275" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="280" width="280" height="45" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="308" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">🔓 登录接口直接可用</text>

  <line x1="720" y1="325" x2="720" y2="350" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="355" width="280" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="720" y="383" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">✅ 测试无需等注册</text>

  <text x="720" y="460" fill="#22d3ee" font-size="11" text-anchor="middle">种子脚本 = 解耦，不是作弊</text>
</svg>