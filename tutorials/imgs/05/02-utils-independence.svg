<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">工具函数层：独立无依赖</text>

  <rect x="100" y="100" width="240" height="100" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="140" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">📦 utils/errors.js</text>
  <text x="220" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">AppError + 预定义错误码</text>
  <text x="220" y="180" fill="#6b7280" font-size="9" text-anchor="middle">不依赖其他模块</text>

  <rect x="360" y="100" width="240" height="100" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="480" y="140" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">🔒 utils/password.js</text>
  <text x="480" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">bcrypt 哈希 + 验证</text>
  <text x="480" y="180" fill="#6b7280" font-size="9" text-anchor="middle">只依赖 bcryptjs</text>

  <rect x="620" y="100" width="240" height="100" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="740" y="140" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">🔑 utils/jwt.js</text>
  <text x="740" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">JWT 签发 + 验证</text>
  <text x="740" y="180" fill="#6b7280" font-size="9" text-anchor="middle">只依赖 config</text>

  <text x="480" y="280" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle" filter="url(#glow)">三个工具函数之间没有依赖关系</text>
  <text x="480" y="305" fill="#94a3b8" font-size="10" text-anchor="middle">可以独立开发、独立测试、独立修改</text>

  <rect x="100" y="340" width="760" height="60" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="365" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">✅ 13 条测试全部通过 | 3 个文件 | 0 个项目内依赖</text>
  <text x="480" y="385" fill="#6b7280" font-size="9" text-anchor="middle">每个文件独立编写，互不影响</text>
</svg>