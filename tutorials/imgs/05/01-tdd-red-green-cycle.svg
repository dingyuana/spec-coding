<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">TDD 循环：RED → GREEN</text>

  <!-- 3 vertical lanes for 3 tools -->
  <rect x="40" y="70" width="280" height="440" rx="10" fill="#0a1628" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
  <text x="180" y="100" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">errors.js</text>
  <rect x="100" y="130" width="160" height="50" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="180" y="150" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">✕ 写测试（RED）</text>
  <text x="180" y="167" fill="#6b7280" font-size="8" text-anchor="middle">6 条测试，全红</text>
  <line x1="180" y1="180" x2="180" y2="210" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="175,210 185,210 180,218" fill="#22d3ee"/>
  <rect x="100" y="225" width="160" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="180" y="245" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle">✓ 写代码（GREEN）</text>
  <text x="180" y="262" fill="#6b7280" font-size="8" text-anchor="middle">6 条测试，全绿 ✅</text>
  <text x="180" y="340" fill="#22c55e" font-size="12" font-weight="700" text-anchor="middle">13 测试通过 ✅</text>

  <rect x="340" y="70" width="280" height="440" rx="10" fill="#0a1628" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
  <text x="480" y="100" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">password.js</text>
  <rect x="400" y="130" width="160" height="50" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="150" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">✕ 写测试（RED）</text>
  <text x="480" y="167" fill="#6b7280" font-size="8" text-anchor="middle">4 条测试，全红</text>
  <line x1="480" y1="180" x2="480" y2="210" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="475,210 485,210 480,218" fill="#22d3ee"/>
  <rect x="400" y="225" width="160" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="245" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle">✓ 写代码（GREEN）</text>
  <text x="480" y="262" fill="#6b7280" font-size="8" text-anchor="middle">4 条测试，全绿 ✅</text>

  <rect x="640" y="70" width="280" height="440" rx="10" fill="#0a1628" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
  <text x="780" y="100" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">jwt.js</text>
  <rect x="700" y="130" width="160" height="50" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="150" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">✕ 写测试（RED）</text>
  <text x="780" y="167" fill="#6b7280" font-size="8" text-anchor="middle">3 条测试，全红</text>
  <line x1="780" y1="180" x2="780" y2="210" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="775,210 785,210 780,218" fill="#22d3ee"/>
  <rect x="700" y="225" width="160" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="780" y="245" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle">✓ 写代码（GREEN）</text>
  <text x="780" y="262" fill="#6b7280" font-size="8" text-anchor="middle">3 条测试，全绿 ✅</text>
</svg>