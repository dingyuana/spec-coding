<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0"/></linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>

  <!-- Title -->
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">SDD + TDD 流水线</text>

  <!-- Column 1: SDD -->
  <rect x="60" y="80" width="240" height="380" rx="12" fill="#1a3a6a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="180" y="105" fill="#3b82f6" font-size="14" font-weight="700" text-anchor="middle">SDD — 写契约</text>

  <rect x="90" y="130" width="180" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="158" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">SPEC.md</text>
  <text x="180" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">业务契约</text>

  <rect x="90" y="200" width="180" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="228" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">PLAN.md</text>
  <text x="180" y="242" fill="#94a3b8" font-size="9" text-anchor="middle">任务看板</text>

  <rect x="90" y="270" width="180" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="298" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">AGENT.md</text>
  <text x="180" y="312" fill="#94a3b8" font-size="9" text-anchor="middle">编码规范</text>

  <text x="180" y="400" fill="#60a5fa" font-size="10" text-anchor="middle">"先想清楚再做"</text>

  <!-- Arrow 1 → 2 -->
  <line x1="300" y1="260" x2="360" y2="260" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: TDD RED -->
  <rect x="370" y="80" width="220" height="380" rx="12" fill="#1a3a6a" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="480" y="105" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">TDD RED — 写测试</text>

  <rect x="400" y="140" width="160" height="50" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="168" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">✕ 单元测试</text>
  <text x="480" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">全部失败（红灯）</text>

  <rect x="400" y="220" width="160" height="50" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="248" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">✕ 集成测试</text>
  <text x="480" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">全部失败（红灯）</text>

  <text x="480" y="400" fill="#fca5a5" font-size="10" text-anchor="middle">"把验收变成断言"</text>

  <!-- Arrow 2 → 3 -->
  <line x1="590" y1="260" x2="650" y2="260" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: GREEN + REFACTOR -->
  <rect x="660" y="80" width="240" height="380" rx="12" fill="#1a3a6a" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="780" y="105" fill="#22c55e" font-size="14" font-weight="700" text-anchor="middle">GREEN + REFACTOR</text>

  <rect x="690" y="140" width="180" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="780" y="168" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">✓ 实现代码</text>
  <text x="780" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">让测试通过</text>

  <rect x="690" y="220" width="180" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="780" y="248" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">✓ 全部通过</text>
  <text x="780" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">25 测试全绿</text>

  <text x="780" y="400" fill="#86efac" font-size="10" text-anchor="middle">"让测试驱动实现"</text>

  <!-- REFACTOR loop arrow -->
  <path d="M 780 430 Q 780 480 480 480 Q 180 480 180 430" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="480" y="510" fill="#22d3ee" font-size="10" text-anchor="middle" filter="url(#glow)">REFACTOR 循环：优化代码，测试保持绿色</text>
</svg>