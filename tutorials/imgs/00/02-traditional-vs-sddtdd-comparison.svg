<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>

  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">传统开发 vs SDD+TDD</text>

  <!-- Left: Traditional -->
  <rect x="40" y="70" width="400" height="430" rx="12" fill="#1a1a2e" fill-opacity="0.4" stroke="#6b7280" stroke-width="1"/>
  <text x="240" y="100" fill="#9ca3af" font-size="14" font-weight="700" text-anchor="middle">传统开发</text>

  <rect x="80" y="130" width="160" height="70" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="160" y="160" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">💡 有想法</text>
  <text x="160" y="178" fill="#6b7280" font-size="9" text-anchor="middle">直接写代码</text>

  <path d="M 240 165 L 300 165" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="310" y="130" width="100" height="70" rx="6" fill="#0f172a" stroke="#6b7280" stroke-width="1"/>
  <text x="360" y="160" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">⚠️ 遇到问题</text>
  <text x="360" y="178" fill="#6b7280" font-size="9" text-anchor="middle">改 → 改 → 改</text>

  <path d="M 360 200 Q 360 250 280 250 Q 160 250 160 200" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="240" y="280" fill="#ef4444" font-size="10" text-anchor="middle">反复修改，容易遗漏</text>
  <text x="240" y="370" fill="#6b7280" font-size="11" text-anchor="middle">设计存在于脑子里</text>
  <text x="240" y="390" fill="#6b7280" font-size="11" text-anchor="middle">三个月后——"这是谁写的？"</text>

  <!-- Center: VS -->
  <text x="480" y="280" fill="#22d3ee" font-size="28" font-weight="700" text-anchor="middle" filter="url(#glow)">VS</text>

  <!-- Right: SDD+TDD -->
  <rect x="520" y="70" width="400" height="430" rx="12" fill="#0a1628" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="720" y="100" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">SDD + TDD</text>

  <rect x="550" y="130" width="160" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="630" y="158" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">① 写 Spec</text>

  <path d="M 710 155 L 750 155" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="130" width="130" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="825" y="158" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">② 写测试</text>

  <path d="M 825 180 L 825 210" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="215" width="130" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="825" y="243" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">③ 写代码</text>

  <path d="M 760 240 L 720 240" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="215" width="160" height="50" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="243" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle">④ 测试通过 ✅</text>

  <text x="720" y="370" fill="#22d3ee" font-size="11" text-anchor="middle">设计存在于契约里</text>
  <text x="720" y="390" fill="#22d3ee" font-size="11" text-anchor="middle">三个月后——"跑测试，全绿 ✅"</text>
</svg>