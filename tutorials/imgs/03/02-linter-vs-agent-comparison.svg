<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">Linter vs AGENT 对比</text>

  <!-- Left circle: Linter -->
  <circle cx="260" cy="280" r="160" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="260" cy="280" r="160" fill="#3b82f6" fill-opacity="0.05"/>
  <text x="260" y="200" fill="#3b82f6" font-size="16" font-weight="700" text-anchor="middle">🛡️ Linter</text>
  <text x="260" y="230" fill="#60a5fa" font-size="11" text-anchor="middle">语法门卫</text>
  <text x="260" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">✅ 缩进 / 分号</text>
  <text x="260" y="295" fill="#94a3b8" font-size="11" text-anchor="middle">✅ 命名风格</text>
  <text x="260" y="320" fill="#94a3b8" font-size="11" text-anchor="middle">✅ 语法错误</text>
  <text x="260" y="360" fill="#6b7280" font-size="10" text-anchor="middle">❌ 管不住 select *</text>
  <text x="260" y="380" fill="#6b7280" font-size="10" text-anchor="middle">❌ 管不住密码泄露</text>

  <!-- Right circle: AGENT -->
  <circle cx="700" cy="280" r="160" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="700" cy="280" r="160" fill="#22d3ee" fill-opacity="0.05"/>
  <text x="700" y="200" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="middle">📜 AGENT</text>
  <text x="700" y="230" fill="#22d3ee" font-size="11" text-anchor="middle">架构门卫</text>
  <text x="700" y="270" fill="#fca5a5" font-size="11" text-anchor="middle">✅ 禁止密码明文</text>
  <text x="700" y="295" fill="#fca5a5" font-size="11" text-anchor="middle">✅ 禁止密钥硬编码</text>
  <text x="700" y="320" fill="#fca5a5" font-size="11" text-anchor="middle">✅ 禁止分层逆流</text>
  <text x="700" y="360" fill="#86efac" font-size="10" text-anchor="middle">+ 测试验证守护</text>

  <!-- Center intersection -->
  <ellipse cx="480" cy="280" rx="50" ry="40" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="275" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle">两者结合</text>
  <text x="480" y="295" fill="#86efac" font-size="10" text-anchor="middle">完整保护</text>

  <!-- Bottom text -->
  <text x="480" y="500" fill="#22d3ee" font-size="11" text-anchor="middle" filter="url(#glow)">Linter + AGENT + 测试 = 代码质量的三重门禁</text>
</svg>