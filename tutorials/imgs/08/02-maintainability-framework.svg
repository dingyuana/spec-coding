<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">可维护性模型</text>

  <!-- Top shield: SPEC -->
  <path d="M 480 60 L 530 100 L 530 160 L 480 190 L 430 160 L 430 100 Z" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 480 60 L 530 100 L 530 160 L 480 190 L 430 160 L 430 100 Z" fill="#3b82f6" fill-opacity="0.08"/>
  <text x="480" y="125" fill="#3b82f6" font-size="11" font-weight="700" text-anchor="middle">SPEC</text>
  <text x="480" y="145" fill="#3b82f6" font-size="9" text-anchor="middle">业务契约</text>

  <!-- Left shield: 测试 -->
  <path d="M 180 230 L 230 270 L 230 330 L 180 360 L 130 330 L 130 270 Z" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <path d="M 180 230 L 230 270 L 230 330 L 180 360 L 130 330 L 130 270 Z" fill="#22d3ee" fill-opacity="0.08"/>
  <text x="180" y="295" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">测试</text>
  <text x="180" y="315" fill="#22d3ee" font-size="9" text-anchor="middle">自动验证</text>

  <!-- Right shield: AGENT -->
  <path d="M 780 230 L 830 270 L 830 330 L 780 360 L 730 330 L 730 270 Z" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <path d="M 780 230 L 830 270 L 830 330 L 780 360 L 730 330 L 730 270 Z" fill="#60a5fa" fill-opacity="0.08"/>
  <text x="780" y="295" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">AGENT</text>
  <text x="780" y="315" fill="#60a5fa" font-size="9" text-anchor="middle">编码规范</text>

  <!-- Bottom shield: 代码 -->
  <path d="M 480 380 L 530 420 L 530 480 L 480 510 L 430 480 L 430 420 Z" fill="#0f172a" stroke="#22c55e" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 480 380 L 530 420 L 530 480 L 480 510 L 430 480 L 430 420 Z" fill="#22c55e" fill-opacity="0.12"/>
  <text x="480" y="445" fill="#22c55e" font-size="12" font-weight="700" text-anchor="middle">代码</text>
  <text x="480" y="465" fill="#22c55e" font-size="9" text-anchor="middle">由三个守护</text>

  <!-- Connection lines -->
  <line x1="480" y1="190" x2="380" y2="240" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="480" y1="190" x2="580" y2="240" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="380" y1="360" x2="440" y2="390" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="580" y1="360" x2="520" y2="390" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Center label -->
  <circle cx="480" cy="300" r="30" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="480" y="296" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">可维护</text>
  <text x="480" y="312" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">性</text>

  <text x="480" y="540" fill="#22d3ee" font-size="11" text-anchor="middle" filter="url(#glow)">SPEC + 测试 + AGENT 三面守护，代码不改形</text>
</svg>