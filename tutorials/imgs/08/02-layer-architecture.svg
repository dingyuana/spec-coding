<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)" opacity="0.3"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">分层架构：单向依赖</text>

  <rect x="80" y="80" width="800" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="110" fill="#3b82f6" font-size="13" font-weight="700" text-anchor="middle">📡 路由层 | routes/auth.js</text>
  <text x="480" y="128" fill="#94a3b8" font-size="9" text-anchor="middle">router.post('/login', AuthController.login)</text>
  <line x1="480" y1="140" x2="480" y2="155" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="475,155 485,155 480,163" fill="#22d3ee"/>

  <rect x="80" y="168" width="800" height="60" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="480" y="198" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">🎮 控制器层 | controllers/authController.js</text>
  <text x="480" y="216" fill="#94a3b8" font-size="9" text-anchor="middle">参数校验 + 调用 service + 格式化响应</text>
  <line x1="480" y1="228" x2="480" y2="243" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="475,243 485,243 480,251" fill="#22d3ee"/>

  <rect x="80" y="256" width="800" height="60" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="480" y="286" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">⚙️ 服务层 | services/authService.js</text>
  <text x="480" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">纯业务逻辑：查用户 → 验密码 → 签 JWT</text>
  <line x1="480" y1="316" x2="480" y2="331" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="475,331 485,331 480,339" fill="#22d3ee"/>

  <rect x="80" y="344" width="800" height="60" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="480" y="374" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">🗄️ 模型层 | models/user.js</text>
  <text x="480" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">数据存取：findByUsername / create / clear</text>

  <rect x="80" y="420" width="800" height="40" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">依赖方向：路由 → 控制器 → 服务层 → 模型层（单向，禁止逆流）</text>
</svg>