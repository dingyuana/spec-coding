<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="op" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="sk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="20" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700">三大 SDD 框架对比全景</text>
  <text x="600" y="88" text-anchor="middle" fill="#94a3b8" font-size="15">OpenSpec · Superpowers · Spec-Kit —— 三种哲学，三条路</text>

  <!-- OPEN- spec column -->
  <g filter="url(#shadow)">
    <rect x="30" y="120" width="360" height="540" rx="16" fill="#0c1524" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <rect x="30" y="120" width="360" height="62" rx="16" fill="url(#op)"/>
    <rect x="30" y="168" width="360" height="14" fill="url(#op)"/>
    <text x="210" y="156" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">OpenSpec</text>
    <text x="210" y="172" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">笔记本 · Noteepad</text>
  </g>
  <text x="210" y="218" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">轻量规范层</text>
  <text x="210" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">TypeScript / npm</text>
  <line x1="50" y1="258" x2="370" y2="258" stroke="#1e293b" stroke-width="2"/>

  <text x="50" y="290" fill="#cbd5e1" font-size="13" font-weight="600">▎核心哲学</text>
  <text x="50" y="312" fill="#94a3b8" font-size="11">AI 需要一份"看着干活"的文档</text>
  <text x="50" y="328" fill="#94a3b8" font-size="11">但不绑架你的流程</text>

  <text x="50" y="365" fill="#cbd5e1" font-size="13" font-weight="600">▎工作流</text>
  <text x="50" y="387" fill="#e2e8f0" font-size="12" font-family="monospace">propose → apply → archive</text>

  <text x="50" y="420" fill="#cbd5e1" font-size="13" font-weight="600">▎强制程度</text>
  <rect x="50" y="430" width="100" height="10" rx="5" fill="#22c55e"/>
  <rect x="150" y="430" width="40" height="10" rx="5" fill="#1e293b"/>
  <rect x="190" y="430" width="40" height="10" rx="5" fill="#1e293b"/>
  <rect x="230" y="430" width="40" height="10" rx="5" fill="#1e293b"/>
  <text x="275" y="440" fill="#94a3b8" font-size="11">最弱</text>

  <text x="50" y="470" fill="#cbd5e1" font-size="13" font-weight="600">▎适用场景</text>
  <text x="50" y="492" fill="#94a3b8" font-size="11">· 存量老项目增量迭代</text>
  <text x="50" y="510" fill="#94a3b8" font-size="11">· 个人开发者 / 小团队</text>
  <text x="50" y="528" fill="#94a3b8" font-size="11">· 快速原型开发</text>

  <text x="50" y="565" fill="#cbd5e1" font-size="13" font-weight="600">▎核心亮点</text>
  <text x="50" y="587" fill="#22c55e" font-size="12" font-weight="600">▸ Delta Spec：只关注变更点</text>
  <text x="50" y="605" fill="#22c55e" font-size="12" font-weight="600">▸ 三步上手，极低门槛</text>
  <text x="50" y="623" fill="#22c55e" font-size="12" font-weight="600">▸ 随时调整，无僵化阶段门</text>

  <text x="210" y="660" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">「想怎么走就走怎么走」</text>
  <text x="210" y="682" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">"先共识、后编码"</text>
  <text x="210" y="698" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">适合：敏捷迭代</text>

  <!-- Superpowers column -->
  <g filter="url(#shadow)">
    <rect x="420" y="120" width="360" height="540" rx="16" fill="#0c1524" stroke="#f472b6" stroke-width="1.5" opacity="0.95"/>
    <rect x="420" y="120" width="360" height="62" rx="16" fill="url(#sp)"/>
    <rect x="420" y="168" width="360" height="14" fill="url(#sp)"/>
    <text x="600" y="156" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Superpowers</text>
    <text x="600" y="172" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">教官 · Drill Sergeant</text>
  </g>
  <text x="600" y="218" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="600">纪律系统</text>
  <text x="600" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">Markdown + JS Skills</text>
  <line x1="440" y1="258" x2="760" y2="258" stroke="#1e293b" stroke-width="2"/>

  <text x="440" y="290" fill="#cbd5e1" font-size="13" font-weight="600">▎核心哲学</text>
  <text x="440" y="312" fill="#94a3b8" font-size="11">AI 够聪明，但不够自律</text>
  <text x="440" y="328" fill="#94a3b8" font-size="11">必须用纪律让它不可能做错</text>

  <text x="440" y="365" fill="#cbd5e1" font-size="13" font-weight="600">▎工作流</text>
  <text x="440" y="387" fill="#e2e8f0" font-size="11" font-family="monospace">头脑风暴→方案→子Agent</text>
  <text x="440" y="403" fill="#e2e8f0" font-size="11" font-family="monospace">TDD开发→审查→收尾</text>

  <text x="440" y="430" fill="#cbd5e1" font-size="13" font-weight="600">▎强制程度</text>
  <rect x="440" y="440" width="140" height="10" rx="5" fill="#f472b6"/>
  <rect x="580" y="440" width="40" height="10" rx="5" fill="#1e293b"/>
  <rect x="620" y="440" width="40" height="10" rx="5" fill="#1e293b"/>
  <rect x="660" y="440" width="40" height="10" rx="5" fill="#1e293b"/>
  <text x="705" y="450" fill="#94a3b8" font-size="11">最强</text>

  <text x="440" y="470" fill="#cbd5e1" font-size="13" font-weight="600">▎适用场景</text>
  <text x="440" y="492" fill="#94a3b8" font-size="11">· 重度 TDD 信仰者</text>
  <text x="440" y="510" fill="#94a3b8" font-size="11">· 个人开发者（Claude Code）</text>
  <text x="440" y="528" fill="#94a3b8" font-size="11">· 追求生产级质量</text>

  <text x="440" y="565" fill="#cbd5e1" font-size="13" font-weight="600">▎核心亮点</text>
  <text x="440" y="587" fill="#f472b6" font-size="12" font-weight="600">▸ 强制 TDD 红-绿-重构闭环</text>
  <text x="440" y="605" fill="#f472b6" font-size="12" font-weight="600">▸ 技能(Skills)模块化组合</text>
  <text x="440" y="623" fill="#f472b6" font-size="12" font-weight="600">▸ AI 自主工作不偏离架构</text>

  <text x="600" y="660" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">「没有商量的余地」</text>
  <text x="600" y="682" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">「纪律，让 AI 不可能做错」</text>
  <text x="600" y="698" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">适合：高质自律开发</text>

  <!-- Spec-Kit column -->
  <g filter="url(#shadow)">
    <rect x="810" y="120" width="360" height="540" rx="16" fill="#0c1524" stroke="#a78bfa" stroke-width="1.5" opacity="0.95"/>
    <rect x="810" y="120" width="360" height="62" rx="16" fill="url(#sk)"/>
    <rect x="810" y="168" width="360" height="14" fill="url(#sk)"/>
    <text x="990" y="156" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Spec-Kit</text>
    <text x="990" y="172" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">宪法 · Constitution</text>
  </g>
  <text x="990" y="218" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">规范即代码</text>
  <text x="990" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">Python / uv</text>
  <line x1="830" y1="258" x2="1150" y2="258" stroke="#1e293b" stroke-width="2"/>

  <text x="830" y="290" fill="#cbd5e1" font-size="13" font-weight="600">▎核心哲学</text>
  <text x="830" y="312" fill="#94a3b8" font-size="11">代码不是真相，规范才是真相</text>
  <text x="830" y="328" fill="#94a3b8" font-size="11">规格即法律，宪法即权威</text>

  <text x="830" y="365" fill="#cbd5e1" font-size="13" font-weight="600">▎工作流</text>
  <text x="830" y="387" fill="#e2e8f0" font-size="11" font-family="monospace">constitution→specify→plan</text>
  <text x="830" y="403" fill="#e2e8f0" font-size="11" font-family="monospace">→tasks→implement</text>

  <text x="830" y="430" fill="#cbd5e1" font-size="13" font-weight="600">▎强制程度</text>
  <rect x="830" y="440" width="100" height="10" rx="5" fill="#a78bfa"/>
  <rect x="930" y="440" width="40" height="10" rx="5" fill="#a78bfa"/>
  <rect x="970" y="440" width="40" height="10" rx="5" fill="#1e293b"/>
  <rect x="1010" y="440" width="40" height="10" rx="5" fill="#1e293b"/>
  <text x="1055" y="450" fill="#94a3b8" font-size="11">中等</text>

  <text x="830" y="470" fill="#cbd5e1" font-size="13" font-weight="600">▎适用场景</text>
  <text x="830" y="492" fill="#94a3b8" font-size="11">· 企业团队从零构建新系统</text>
  <text x="830" y="510" fill="#94a3b8" font-size="11">· 跨团队协作 &amp; 治理</text>
  <text x="830" y="528" fill="#94a3b8" font-size="11">· 强约束 · 高可预测性</text>

  <text x="830" y="565" fill="#cbd5e1" font-size="13" font-weight="600">▎核心亮点</text>
  <text x="830" y="587" fill="#a78bfa" font-size="12" font-weight="600">▸ 宪法(Constitution)机制</text>
  <text x="830" y="605" fill="#a78bfa" font-size="12" font-weight="600">▸ 深度绑定 GitHub 生态</text>
  <text x="830" y="623" fill="#a78bfa" font-size="12" font-weight="600">▸ 规范化治理 · 模板约束</text>

  <text x="990" y="660" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">「规范即法律」</text>
  <text x="990" y="682" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">「项目原则的一致性守护者」</text>
  <text x="990" y="698" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">适合：企业级治理</text>
</svg>
