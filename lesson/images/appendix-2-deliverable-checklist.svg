<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">完整交付物一览 — 对照清单</text>
  <!-- Mirror metaphor -->
  <rect x="60" y="70" width="320" height="180" rx="12" fill="#fff" stroke="#4a90d9" stroke-width="2"/>
  <text x="220" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90d9">交付物清单</text>
  <g transform="translate(80, 120)">
    <circle cx="10" cy="10" r="5" fill="#5cb85c"/>
    <text x="25" y="15" font-size="12" fill="#333">Spec.md — 规格合同</text>
  </g>
  <g transform="translate(80, 150)">
    <circle cx="10" cy="10" r="5" fill="#5cb85c"/>
    <text x="25" y="15" font-size="12" fill="#333">Task.md — 任务分解</text>
  </g>
  <g transform="translate(80, 180)">
    <circle cx="10" cy="10" r="5" fill="#5cb85c"/>
    <text x="25" y="15" font-size="12" fill="#333">Agent.md — 工作规则</text>
  </g>
  <g transform="translate(80, 210)">
    <circle cx="10" cy="10" r="5" fill="#5cb85c"/>
    <text x="25" y="15" font-size="12" fill="#333">traceability.md — 追溯</text>
  </g>
  <g transform="translate(80, 240)">
    <circle cx="10" cy="10" r="5" fill="#5cb85c"/>
    <text x="25" y="15" font-size="12" fill="#333">全部代码 + 测试</text>
  </g>

  <!-- Right: Stats -->
  <rect x="420" y="70" width="320" height="180" rx="12" fill="#fff" stroke="#5cb85c" stroke-width="2"/>
  <text x="580" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#5cb85c">项目统计</text>
  <g transform="translate(440, 120)">
    <rect x="0" y="0" width="280" height="30" rx="6" fill="#eaf7ea"/>
    <text x="140" y="20" text-anchor="middle" font-size="12" fill="#333">测试数量：24 个自动化测试</text>
  </g>
  <g transform="translate(440, 160)">
    <rect x="0" y="0" width="280" height="30" rx="6" fill="#e8f4fd"/>
    <text x="140" y="20" text-anchor="middle" font-size="12" fill="#333">需求覆盖：29 条需求</text>
  </g>
  <g transform="translate(440, 200)">
    <rect x="0" y="0" width="280" height="30" rx="6" fill="#fff5e6"/>
    <text x="140" y="20" text-anchor="middle" font-size="12" fill="#333">功能模块：注册 + 数据库 + Web</text>
  </g>

  <!-- How to use -->
  <rect x="100" y="280" width="600" height="90" rx="12" fill="#fff" stroke="#e6a817" stroke-width="1.5"/>
  <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b">如何使用这份交付物</text>
  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#666">➤ 对照检查自己的项目结构是否完整</text>
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="#666">➤ 复制 Spec / Task / Agent.md 作为下一个项目的模板</text>

  <!-- Bottom -->
  <rect x="150" y="400" width="500" height="55" rx="10" fill="#4a90d9" opacity="0.08"/>
  <text x="400" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">项目最关键的不是代码，而是 Spec + 测试</text>
  <text x="400" y="448" text-anchor="middle" font-size="12" fill="#666">代码会改，但 Spec 和测试是项目的灵魂——它们定义并验证了"正确"</text>
</svg>