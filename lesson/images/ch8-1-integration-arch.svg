<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">从内存到真实世界 — 集成架构</text>
  <!-- Layer 1: Tests -->
  <rect x="100" y="70" width="600" height="50" rx="8" fill="#d9534f"/>
  <text x="400" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">单元测试 → 集成测试 → 端到端测试</text>
  <!-- Arrow -->
  <line x1="400" y1="120" x2="400" y2="140" stroke="#999" stroke-width="2"/>
  <polygon points="395,140 405,140 400,148" fill="#999"/>
  <!-- Layer 2: Web API -->
  <rect x="100" y="150" width="600" height="50" rx="8" fill="#4a90d9"/>
  <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Flask Web API 层</text>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="#e8f4fd">POST /register → 路由 → 参数校验 → 业务逻辑</text>
  <!-- Arrow -->
  <line x1="400" y1="200" x2="400" y2="220" stroke="#999" stroke-width="2"/>
  <polygon points="395,220 405,220 400,228" fill="#999"/>
  <!-- Layer 3: Business logic -->
  <rect x="100" y="230" width="600" height="50" rx="8" fill="#5cb85c"/>
  <text x="400" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">业务逻辑层</text>
  <text x="400" y="275" text-anchor="middle" font-size="11" fill="#eaf7ea">邮箱校验 → 密码强度 → 重复检查 → 用户注册</text>
  <!-- Arrow -->
  <line x1="400" y1="280" x2="400" y2="300" stroke="#999" stroke-width="2"/>
  <polygon points="395,300 405,300 400,308" fill="#999"/>
  <!-- Layer 4: Database -->
  <rect x="100" y="310" width="600" height="50" rx="8" fill="#f0ad4e"/>
  <text x="400" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">SQLite 数据库层</text>
  <text x="400" y="355" text-anchor="middle" font-size="11" fill="#fff5e6">users 表 → 持久化存储 → 数据查询</text>
  <!-- Before/After -->
  <rect x="100" y="390" width="280" height="50" rx="8" fill="#fdecea"/>
  <text x="240" y="415" text-anchor="middle" font-size="12" fill="#d9534f">之前：纯内存函数</text>
  <text x="240" y="425" text-anchor="middle" font-size="10" fill="#999">在 Python 进程内运行</text>

  <rect x="420" y="390" width="280" height="50" rx="8" fill="#eaf7ea"/>
  <text x="560" y="415" text-anchor="middle" font-size="12" fill="#5cb85c">之后：完整 Web 服务</text>
  <text x="560" y="425" text-anchor="middle" font-size="10" fill="#666">浏览器 / Postman 可调用</text>
</svg>