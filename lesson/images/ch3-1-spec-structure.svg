<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#faf0e0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">合同式规格文档结构</text>
  <!-- Document -->
  <rect x="250" y="65" width="300" height="360" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="250" y="65" width="300" height="35" rx="8" fill="#e6a817"/>
  <rect x="250" y="92" width="300" height="8" fill="#e6a817"/>
  <text x="400" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Spec.md — 规格合同</text>
  <!-- Section 1 -->
  <rect x="270" y="115" width="260" height="35" rx="6" fill="#f5f5f5"/>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1. 概述</text>
  <text x="400" y="115" text-anchor="middle" font-size="10" fill="#999">(顶部)</text>
  <!-- Section 2 -->
  <rect x="270" y="160" width="260" height="55" rx="6" fill="#e8f4fd"/>
  <text x="275" y="178" font-size="12" fill="#4a90d9" font-weight="bold">2. 功能需求</text>
  <text x="275" y="196" font-size="11" fill="#666">REQ-001: 邮箱格式校验</text>
  <text x="275" y="210" font-size="11" fill="#666">REQ-002: 密码强度规则</text>
  <!-- Section 3 -->
  <rect x="270" y="225" width="260" height="55" rx="6" fill="#fdecea"/>
  <text x="275" y="243" font-size="12" fill="#d9534f" font-weight="bold">3. 边界条件</text>
  <text x="275" y="261" font-size="11" fill="#666">REQ-003: 空值、特殊字符</text>
  <text x="275" y="275" font-size="11" fill="#666">REQ-004: 超长、重复</text>
  <!-- Section 4 -->
  <rect x="270" y="290" width="260" height="55" rx="6" fill="#eaf7ea"/>
  <text x="275" y="308" font-size="12" fill="#5cb85c" font-weight="bold">4. 验收标准</text>
  <text x="275" y="326" font-size="11" fill="#666">AC-001: 所有测试通过</text>
  <text x="275" y="340" font-size="11" fill="#666">AC-002: 覆盖率 ≥ 90%</text>
  <!-- Section 5 -->
  <rect x="270" y="355" width="260" height="35" rx="6" fill="#fff5e6"/>
  <text x="275" y="375" font-size="12" fill="#f0ad4e" font-weight="bold">5. 数据定义</text>
  <text x="275" y="393" font-size="11" fill="#666">输入/输出格式、错误码</text>
  <!-- Bottom note -->
  <rect x="100" y="410" width="600" height="30" rx="8" fill="#e6a817" opacity="0.1"/>
  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#b8860b">先写 Spec（合同），再写代码——需求说清楚，Agent 才做对</text>
</svg>