<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e0edf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">十步进阶图 — 从入门到精通</text>
  <!-- Steps -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="20" fill="#4a90d9"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">认识方法论</text>
  </g>
  <g transform="translate(60, 130)">
    <circle cx="20" cy="20" r="20" fill="#4a90d9"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">搭建开发环境</text>
  </g>
  <g transform="translate(60, 180)">
    <circle cx="20" cy="20" r="20" fill="#e6a817"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">编写 Spec</text>
  </g>
  <g transform="translate(60, 230)">
    <circle cx="20" cy="20" r="20" fill="#d9534f"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">Agent 写测试</text>
  </g>
  <g transform="translate(60, 280)">
    <circle cx="20" cy="20" r="20" fill="#5cb85c"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">5</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">Agent 实现代码</text>
  </g>
  <g transform="translate(420, 80)">
    <circle cx="20" cy="20" r="20" fill="#f0ad4e"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">6</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">补全边界测试</text>
  </g>
  <g transform="translate(420, 130)">
    <circle cx="20" cy="20" r="20" fill="#e6a817"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">7</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">审查与重构</text>
  </g>
  <g transform="translate(420, 180)">
    <circle cx="20" cy="20" r="20" fill="#4a90d9"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">8</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">集成数据库/Web</text>
  </g>
  <g transform="translate(420, 230)">
    <circle cx="20" cy="20" r="20" fill="#5cb85c"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">9</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">Spec 活文档</text>
  </g>
  <g transform="translate(420, 280)">
    <circle cx="20" cy="20" r="20" fill="#d9534f"/>
    <text x="20" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">10</text>
    <text x="55" y="26" font-size="12" fill="#333" font-weight="bold">总结 & 毕业</text>
  </g>
  <!-- Connecting lines -->
  <line x1="280" y1="100" x2="420" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="280" y1="150" x2="420" y2="150" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="280" y1="200" x2="420" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="280" y1="250" x2="420" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="280" y1="300" x2="420" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Bottom -->
  <rect x="150" y="370" width="500" height="55" rx="10" fill="#fff" stroke="#e6a817" stroke-width="1.5"/>
  <text x="400" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8860b">完成全部 10 章 + 附录 → 你已掌握 Agent+SDD+TDD 完整技能</text>
  <text x="400" y="416" text-anchor="middle" font-size="12" fill="#666">从现在开始，每个项目都用这套方法论来做</text>
</svg>