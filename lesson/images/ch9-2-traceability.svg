<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">需求追溯矩阵 — 双向可追溯</text>
  <!-- Matrix header -->
  <rect x="60" y="70" width="680" height="35" rx="6" fill="#4a90d9"/>
  <text x="160" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">需求编号</text>
  <text x="320" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">需求描述</text>
  <text x="500" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">测试方法</text>
  <text x="640" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">实现状态</text>
  <!-- Rows -->
  <rect x="60" y="110" width="680" height="30" rx="4" fill="#eaf7ea"/>
  <text x="160" y="130" text-anchor="middle" font-size="11" fill="#555">REQ-001</text>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="#555">邮箱格式校验</text>
  <text x="500" y="130" text-anchor="middle" font-size="11" fill="#5cb85c">test_valid_email</text>
  <text x="640" y="130" text-anchor="middle" font-size="11" fill="#5cb85c">✅</text>

  <rect x="60" y="145" width="680" height="30" rx="4" fill="#eaf7ea"/>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#555">REQ-002</text>
  <text x="320" y="165" text-anchor="middle" font-size="11" fill="#555">密码强度规则</text>
  <text x="500" y="165" text-anchor="middle" font-size="11" fill="#5cb85c">test_password_strength</text>
  <text x="640" y="165" text-anchor="middle" font-size="11" fill="#5cb85c">✅</text>

  <rect x="60" y="180" width="680" height="30" rx="4" fill="#eaf7ea"/>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#555">REQ-003</text>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="#555">重复注册检查</text>
  <text x="500" y="200" text-anchor="middle" font-size="11" fill="#5cb85c">test_duplicate_user</text>
  <text x="640" y="200" text-anchor="middle" font-size="11" fill="#5cb85c">✅</text>

  <rect x="60" y="215" width="680" height="30" rx="4" fill="#eaf7ea"/>
  <text x="160" y="235" text-anchor="middle" font-size="11" fill="#555">REQ-004</text>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="#555">边界错误处理</text>
  <text x="500" y="235" text-anchor="middle" font-size="11" fill="#5cb85c">test_boundary*</text>
  <text x="640" y="235" text-anchor="middle" font-size="11" fill="#5cb85c">✅</text>

  <rect x="60" y="250" width="680" height="30" rx="4" fill="#eaf7ea"/>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#555">REQ-005</text>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#555">数据库持久化</text>
  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#5cb85c">test_db_integration</text>
  <text x="640" y="270" text-anchor="middle" font-size="11" fill="#5cb85c">✅</text>

  <!-- Continue -->
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#999">... 共 29 条需求，全部被测试覆盖</text>

  <!-- Benefits -->
  <rect x="100" y="330" width="600" height="95" rx="10" fill="#fff" stroke="#e6a817" stroke-width="1.5"/>
  <text x="400" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b">追溯矩阵的价值</text>
  <text x="400" y="380" text-anchor="middle" font-size="12" fill="#666">➤ 每个需求都能找到对应的测试用例</text>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#666">➤ 每个测试都能追溯到原始需求</text>
  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#666">➤ 没有遗漏的需求，没有多余的代码</text>
</svg>