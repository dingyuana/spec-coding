<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a8ea8"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">需求 → Spec 转化流程</text>
  <!-- Step 1: Raw requirement -->
  <rect x="80" y="80" width="200" height="100" rx="12" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="180" y="115" text-anchor="middle" font-size="14" fill="#999">模糊需求</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#aaa">"做一个登录功能"</text>
  <text x="180" y="165" text-anchor="middle" font-size="11" fill="#ccc">邮箱校验？密码规则？</text>
  <!-- Arrow -->
  <path d="M280,130 L340,130" stroke="#e6a817" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2: Refine -->
  <rect x="350" y="65" width="200" height="130" rx="12" fill="#fff5e6" stroke="#e6a817" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b">需求分析</text>
  <text x="450" y="120" text-anchor="middle" font-size="11" fill="#666">拆解功能点</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#666">明确边界条件</text>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#666">定义验收标准</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#666">约定错误返回</text>
  <!-- Arrow -->
  <path d="M550,130 L610,130" stroke="#e6a817" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3: Spec -->
  <rect x="620" y="80" width="150" height="100" rx="12" fill="#4a90d9"/>
  <text x="695" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Spec.md</text>
  <text x="695" y="140" text-anchor="middle" font-size="12" fill="#e8f4fd">正式合同</text>
  <text x="695" y="165" text-anchor="middle" font-size="11" fill="#e8f4fd">无歧义</text>
  <!-- Bottom: principle -->
  <rect x="100" y="280" width="600" height="130" rx="12" fill="#fff" stroke="#e6a817" stroke-width="1.5"/>
  <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b">SDD 核心原则</text>
  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#555">"先定义再实现"</text>
  <text x="400" y="370" text-anchor="middle" font-size="12" fill="#777">需求是模糊的，Spec 是精确的 → Agent 以 Spec 为准</text>
  <text x="400" y="395" text-anchor="middle" font-size="12" fill="#777">写完 Spec，人和 Agent 对需求的认知完全一致</text>
</svg>