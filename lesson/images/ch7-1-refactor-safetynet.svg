<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">在安全网下跳舞 — 重构的艺术</text>
  <!-- Safety net -->
  <rect x="100" y="330" width="600" height="60" rx="12" fill="#5cb85c" opacity="0.3"/>
  <rect x="100" y="330" width="600" height="60" rx="12" fill="none" stroke="#5cb85c" stroke-width="2"/>
  <text x="400" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#449d44">安全网：18 个自动化测试</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#666">pytest — 运行一次只需 2 秒</text>
  <!-- Dancer above -->
  <circle cx="400" cy="140" r="35" fill="#e8f4fd" stroke="#4a90d9" stroke-width="2"/>
  <text x="400" y="148" text-anchor="middle" font-size="32">💃</text>
  <text x="400" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90d9">重构（Refactor）</text>
  <text x="400" y="220" text-anchor="middle" font-size="12" fill="#666">不改变外部行为，改善内部结构</text>
  <!-- Two columns: Before / After -->
  <rect x="80" y="250" width="300" height="60" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1"/>
  <text x="230" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#d9534f">重构前</text>
  <text x="230" y="295" text-anchor="middle" font-size="11" fill="#666">一个函数 80 行，逻辑混杂</text>

  <rect x="420" y="250" width="300" height="60" rx="8" fill="#eaf7ea" stroke="#5cb85c" stroke-width="1"/>
  <text x="570" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#5cb85c">重构后</text>
  <text x="570" y="295" text-anchor="middle" font-size="11" fill="#666">拆分为 3 个清晰函数</text>
  <!-- Arrow -->
  <text x="390" y="290" text-anchor="middle" font-size="20" fill="#5cb85c">→</text>
  <!-- Bottom principle -->
  <rect x="100" y="410" width="600" height="35" rx="8" fill="#f0ad4e" opacity="0.15"/>
  <text x="400" y="433" text-anchor="middle" font-size="13" fill="#e6a817">安全网（测试）让你敢改——改坏了测试会告诉你</text>
</svg>