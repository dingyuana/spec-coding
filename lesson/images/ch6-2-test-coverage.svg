<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">边界测试扩展示意</text>
  <!-- Function diagram -->
  <rect x="50" y="80" width="700" height="60" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">register(email, password, username)</text>
  <text x="400" y="125" text-anchor="middle" font-size="12" fill="#888">输入参数 → 业务逻辑 → 返回结果</text>
  <!-- Test cases below -->
  <text x="400" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">测试覆盖维度</text>
  <!-- Normal -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#eaf7ea" stroke="#5cb85c" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#5cb85c">正常路径</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#666">有效邮箱 + 强密码</text>
  </g>
  <!-- Boundary -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#fff5e6" stroke="#f0ad4e" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#f0ad4e">边界值</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#666">最短/最长密码</text>
  </g>
  <!-- Error -->
  <g transform="translate(520, 200)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#d9534f">异常路径</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#666">空值、已注册</text>
  </g>
  <!-- Test count growth -->
  <rect x="100" y="280" width="600" height="60" rx="12" fill="#fff" stroke="#e6a817" stroke-width="1.5"/>
  <text x="400" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8860b">测试套件扩展</text>
  <text x="400" y="328" text-anchor="middle" font-size="12" fill="#666">15 个基础测试 → 补全边界测试 → 18 个全面测试</text>
  <!-- Bottom -->
  <rect x="100" y="370" width="600" height="55" rx="8" fill="#4a90d9" opacity="0.1"/>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#4a90d9">测试覆盖率 = 安全网密度</text>
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="#666">边界越完整，重构越安全，Bug 越少</text>
</svg>