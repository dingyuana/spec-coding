<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="430" fill="url(#bg)" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Agent 集成数据库与 Web 流程</text>
  <!-- Flow -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="#4a90d9"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">创建数据库模块</text>
    <text x="100" y="50" text-anchor="middle" font-size="11" fill="#e8f4fd">SQLite + 表结构</text>
  </g>
  <text x="280" y="118" text-anchor="middle" font-size="18" fill="#999">→</text>
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="#5cb85c"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">搭建 Flask API</text>
    <text x="100" y="50" text-anchor="middle" font-size="11" fill="#eaf7ea">路由 + 请求处理</text>
  </g>
  <text x="530" y="118" text-anchor="middle" font-size="18" fill="#999">→</text>
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#f0ad4e"/>
    <text x="90" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">集成测试</text>
    <text x="90" y="50" text-anchor="middle" font-size="11" fill="#fff5e6">端到端验证</text>
  </g>
  <!-- Result box -->
  <rect x="100" y="180" width="600" height="80" rx="12" fill="#fff" stroke="#e6a817" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b">完成后效果</text>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#666">在浏览器访问 http://localhost:5000/register</text>
  <text x="400" y="252" text-anchor="middle" font-size="12" fill="#666">输入表单 → 提交 → 写入数据库 → 返回结果</text>
  <!-- Bottom comparison -->
  <rect x="100" y="290" width="600" height="50" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="318" text-anchor="middle" font-size="13" fill="#666">测试数量：15 单元测试 + 3 集成测试 = 18 个全面测试</text>
  <text x="400" y="335" text-anchor="middle" font-size="11" fill="#888">覆盖 29 条需求，有数据库和 Web 接口的完整系统</text>
  <!-- -->
  <rect x="150" y="370" width="500" height="40" rx="8" fill="#5cb85c" opacity="0.1"/>
  <text x="400" y="396" text-anchor="middle" font-size="13" fill="#449d44">Agent 从"实验室"走向"生产环境"的关键一步</text>
</svg>