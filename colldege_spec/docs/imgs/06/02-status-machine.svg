<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="a" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#22d3ee"/></marker>
  </defs>
  <rect width="960" height="440" fill="url(#bg)"/>
  <text x="480" y="34" fill="#22d3ee" font-size="19" font-weight="700" text-anchor="middle" filter="url(#glow)">状态机 — SUBMITTED / APPROVED / REJECTED</text>
  <g>
    <rect x="100" y="150" width="140" height="80" rx="10" fill="#1a2a3a" stroke="#94a3b8"/>
    <text x="170" y="180" fill="#94a3b8" font-size="13" font-weight="700" text-anchor="middle">PENDING</text>
    <text x="170" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">初始状态</text>
    <text x="170" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">未提交</text>
  </g>
  <line x1="245" y1="190" x2="335" y2="190" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="180" fill="#22d3ee" font-size="9" text-anchor="middle">提交</text>
  <g>
    <rect x="340" y="150" width="140" height="80" rx="10" fill="#1a3a1a" stroke="#22c55e"/>
    <text x="410" y="180" fill="#22c55e" font-size="13" font-weight="700" text-anchor="middle">SUBMITTED</text>
    <text x="410" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">等待审核</text>
    <text x="410" y="220" fill="#ef4444" font-size="9" text-anchor="middle">❌ 不可修改</text>
  </g>
  <line x1="485" y1="165" x2="575" y2="135" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="125" fill="#22d3ee" font-size="9" text-anchor="middle">审核通过</text>
  <line x1="485" y1="215" x2="575" y2="245" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="240" fill="#22d3ee" font-size="9" text-anchor="middle">审核驳回</text>
  <g>
    <rect x="580" y="90" width="140" height="80" rx="10" fill="#1a3a1a" stroke="#22c55e"/>
    <text x="650" y="120" fill="#22c55e" font-size="13" font-weight="700" text-anchor="middle">APPROVED</text>
    <text x="650" y="140" fill="#94a3b8" font-size="10" text-anchor="middle">已通过</text>
    <text x="650" y="160" fill="#ef4444" font-size="9" text-anchor="middle">❌ 不可修改</text>
  </g>
  <g>
    <rect x="580" y="240" width="140" height="80" rx="10" fill="#3a2a1a" stroke="#f59e0b"/>
    <text x="650" y="270" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle">REJECTED</text>
    <text x="650" y="290" fill="#94a3b8" font-size="10" text-anchor="middle">已驳回</text>
    <text x="650" y="310" fill="#22c55e" font-size="9" text-anchor="middle">✅ 可修改</text>
  </g>
  <text x="770" y="155" fill="#94a3b8" font-size="10">管理员审核</text>
  <text x="770" y="175" fill="#94a3b8" font-size="10">或辅导员审核</text>
  <text x="770" y="210" fill="#f59e0b" font-size="10">驳回需填写</text>
  <text x="770" y="228" fill="#f59e0b" font-size="10">原因（400）</text>
  <rect x="200" y="360" width="560" height="44" rx="6" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e"/>
  <text x="480" y="388" fill="#22c55e" font-size="12" font-weight="600" text-anchor="middle">SUBMITTED 不可改 / APPROVED 不可改 / REJECTED 可改 → 409 / 200</text>
</svg>
