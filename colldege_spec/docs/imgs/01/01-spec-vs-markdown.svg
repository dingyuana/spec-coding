<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <text x="480" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">Markdown vs YAML 契约</text>
  <rect x="60" y="80" width="420" height="320" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="270" y="105" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle">Markdown 写接口（❌）</text>
  <text x="90" y="140" fill="#94a3b8" font-size="11">格式不统一（表格 vs 列表）</text>
  <text x="90" y="165" fill="#94a3b8" font-size="11">机器无法解析</text>
  <text x="90" y="190" font-size="11" fill="#94a3b8">改了文档不改代码</text>
  <text x="90" y="215" fill="#94a3b8" font-size="11">不能自动 lint / 生成代码</text>
  <text x="90" y="240" fill="#94a3b8" font-size="11">字段遗漏没人发现</text>
  <rect x="90" y="270" width="360" height="44" rx="6" fill="#1a1a2e" stroke="#ef4444" stroke-dasharray="4,3"/>
  <text x="270" y="287" fill="#ef4444" font-size="10" font-style="italic" text-anchor="middle">"接口定义：姓名 string，电话 string..."</text>
  <text x="270" y="303" fill="#ef4444" font-size="10" font-style="italic" text-anchor="middle">(没有字段校验，没有错误码)</text>
  <rect x="480" y="80" width="420" height="320" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="690" y="105" fill="#22c55e" font-size="13" font-weight="700" text-anchor="middle">YAML 契约（✅）</text>
  <text x="510" y="140" fill="#94a3b8" font-size="11">纯 YAML，格式固定</text>
  <text x="510" y="165" fill="#94a3b8" font-size="11">yaml.load() 直接解析</text>
  <text x="510" y="190" font-size="11" fill="#94a3b8">字段遗漏可自动 lint</text>
  <text x="510" y="215" fill="#94a3b8" font-size="11">可生成测试骨架</text>
  <text x="510" y="240" fill="#94a3b8" font-size="11">支持注释，可读性强</text>
  <rect x="510" y="270" width="360" height="50" rx="6" fill="#1a2e1a" stroke="#22c55e"/>
  <text x="690" y="287" fill="#22c55e" font-size="10" font-style="italic" text-anchor="middle">actions: [{id: STU-S1, method: POST,</text>
  <text x="690" y="305" fill="#22c55e" font-size="10" font-style="italic" text-anchor="middle">  errors: [{code: 409}]}]</text>
</svg>
