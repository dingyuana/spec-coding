<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  <text x="480" y="34" fill="#22d3ee" font-size="19" font-weight="700" text-anchor="middle" filter="url(#glow)">管理端看板 — 全局视野</text>
  <g>
    <rect x="60" y="60" width="420" height="380" rx="12" fill="#0f172a" stroke="#22d3ee"/>
    <text x="270" y="88" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">GET /admin/dashboard</text>
    <g>
      <rect x="80" y="110" width="180" height="70" rx="8" fill="#1a2e4a" stroke="#22d3ee"/>
      <text x="170" y="135" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">today_count</text>
      <text x="170" y="165" fill="#22c55e" font-size="22" font-weight="700" text-anchor="middle">42</text>
      <text x="170" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">今日提交</text>
    </g>
    <g>
      <rect x="280" y="110" width="180" height="70" rx="8" fill="#1a2e4a" stroke="#22d3ee"/>
      <text x="370" y="135" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">total_count</text>
      <text x="370" y="165" fill="#22c55e" font-size="22" font-weight="700" text-anchor="middle">120</text>
      <text x="370" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">全校总数</text>
    </g>
    <g>
      <rect x="80" y="200" width="380" height="100" rx="8" fill="#1a2e4a" stroke="#22d3ee"/>
      <text x="270" y="222" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">by_status</text>
      <text x="110" y="250" fill="#22c55e" font-size="13">SUBMITTED: 18</text>
      <text x="110" y="275" fill="#f59e0b" font-size="13">APPROVED: 95</text>
      <text x="270" y="250" fill="#ef4444" font-size="13">REJECTED: 7</text>
      <text x="270" y="275" fill="#94a3b8" font-size="11">(by_college 略)</text>
    </g>
    <rect x="80" y="320" width="380" height="50" rx="6" fill="#1a2e4a" stroke="#22d3ee"/>
    <text x="270" y="343" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">by_college</text>
    <text x="100" y="363" fill="#94a3b8" font-size="10">计算机学院: 45 / 机电学院: 38 / 经管学院: 37</text>
  </g>
  <g>
    <rect x="520" y="60" width="380" height="380" rx="12" fill="#0f172a" stroke="#a855f7"/>
    <text x="710" y="88" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">管理端 5 个接口</text>
    <text x="540" y="120" fill="#94a3b8" font-size="11">GET  /admin/students</text>
    <text x="700" y="120" fill="#22c55e" font-size="10">全局列表</text>
    <text x="540" y="145" fill="#94a3b8" font-size="11">POST /admin/audit/{id}</text>
    <text x="700" y="145" fill="#22c55e" font-size="10">审核通过/驳回</text>
    <text x="540" y="170" fill="#94a3b8" font-size="11">GET  /admin/export</text>
    <text x="700" y="170" fill="#22c55e" font-size="10">导出 CSV</text>
    <text x="540" y="195" fill="#94a3b8" font-size="11">GET  /admin/dashboard</text>
    <text x="700" y="195" fill="#22c55e" font-size="10">全校看板</text>
    <text x="540" y="220" fill="#94a3b8" font-size="11">GET  /admin/logs</text>
    <text x="700" y="220" fill="#22c55e" font-size="10">操作日志</text>
    <text x="540" y="245" fill="#94a3b8" font-size="11">POST /admin/counselors</text>
    <text x="700" y="245" fill="#22c55e" font-size="10">添加辅导员</text>
    <rect x="540" y="280" width="340" height="60" rx="6" fill="#2a1a4a" stroke="#a855f7"/>
    <text x="710" y="305" fill="#a855f7" font-size="11" font-weight="600" text-anchor="middle">辅导员访问 /admin/* → 403</text>
    <text x="710" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">Depends(get_current_admin) 拦死</text>
    <rect x="540" y="360" width="340" height="50" rx="6" fill="#1a2a3a" stroke="#22d3ee"/>
    <text x="710" y="382" fill="#22d3ee" font-size="10" text-anchor="middle">每笔审核写入 AuditLog</text>
    <text x="710" y="400" fill="#22d3ee" font-size="10" text-anchor="middle">谁 / 何时 / 对谁 / 做了什么</text>
  </g>
  <rect x="120" y="455" width="720" height="20" rx="4" fill="#22c55e" fill-opacity="0.1"/>
  <text x="480" y="470" fill="#22c55e" font-size="11" font-weight="600" text-anchor="middle">看板 + 导出 + 日志 = 全局视野 + 可追溯</text>
</svg>
