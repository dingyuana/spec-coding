<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="440" fill="url(#bg)"/>
  <text x="480" y="34" fill="#22d3ee" font-size="19" font-weight="700" text-anchor="middle" filter="url(#glow)">看板返回结构 — 5 个数字 1 个字典</text>
  <rect x="80" y="60" width="800" height="350" rx="12" fill="#0f172a" stroke="#22d3ee"/>
  <text x="100" y="90" fill="#22d3ee" font-size="12" font-weight="700">GET /admin/dashboard → 200 OK</text>
  <text x="100" y="120" fill="#94a3b8" font-size="12">{</text>
  <text x="140" y="150" fill="#22d3ee" font-size="12">"today_count": 42,</text>
  <text x="140" y="150" fill="#94a3b8" font-size="10" x="480">// 今日提交数</text>
  <text x="140" y="180" fill="#22d3ee" font-size="12">"total_count": 120,</text>
  <text x="140" y="180" fill="#94a3b8" font-size="10" x="480">// 全校总数</text>
  <text x="140" y="210" fill="#22d3ee" font-size="12">"by_status": {</text>
  <text x="180" y="235" fill="#22c55e" font-size="12">"SUBMITTED": 18,</text>
  <text x="180" y="260" fill="#f59e0b" font-size="12">"APPROVED": 95,</text>
  <text x="180" y="285" fill="#ef4444" font-size="12">"REJECTED": 7</text>
  <text x="140" y="310" fill="#22d3ee" font-size="12">},</text>
  <text x="140" y="340" fill="#22d3ee" font-size="12">"by_college": {</text>
  <text x="180" y="365" fill="#94a3b8" font-size="11">"计算机学院": 45, "机电学院": 38, "经管学院": 37</text>
  <text x="140" y="390" fill="#22d3ee" font-size="12">}</text>
  <text x="100" y="415" fill="#94a3b8" font-size="12">}</text>
  <rect x="200" y="430" width="560" height="4" fill="#22d3ee"/>
</svg>
