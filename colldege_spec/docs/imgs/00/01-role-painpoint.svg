<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');text{font-family:'JetBrains Mono','Noto Sans SC',monospace;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1f3d"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#22d3ee"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <text x="480" y="38" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">三个角色 × 三个痛点</text>
  <g>
    <rect x="80" y="80" width="220" height="280" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="80" y="80" width="220" height="40" rx="14" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="80" y="106" width="220" height="14" fill="#22d3ee" fill-opacity="0.15"/>
    <text x="190" y="107" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">🎓 学生</text>
    <text x="100" y="148" fill="#94a3b8" font-size="11">• 提交报到信息</text>
    <text x="100" y="170" fill="#94a3b8" font-size="11">• 微信 code 登录</text>
    <text x="100" y="192" fill="#94a3b8" font-size="11">• 查询/修改状态</text>
    <rect x="105" y="225" width="170" height="38" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="190" y="242" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">❌ 身份证输错</text>
    <text x="190" y="255" fill="#ef4444" font-size="10" text-anchor="middle">无法自己修改</text>
    <rect x="105" y="275" width="170" height="38" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="190" y="292" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">❌ 重复提交</text>
    <text x="190" y="305" fill="#ef4444" font-size="10" text-anchor="middle">数据库重复</text>
  </g>
  <g>
    <rect x="370" y="80" width="220" height="280" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="370" y="80" width="220" height="40" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="370" y="106" width="220" height="14" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="480" y="107" fill="#3b82f6" font-size="14" font-weight="700" text-anchor="middle">👨‍🏫 辅导员</text>
    <text x="390" y="148" fill="#94a3b8" font-size="11">• 查看本班学生</text>
    <text x="390" y="170" fill="#94a3b8" font-size="11">• 审核/驳回</text>
    <text x="390" y="192" fill="#94a3b8" font-size="11">• 本班看板</text>
    <rect x="395" y="225" width="170" height="38" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="480" y="242" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">❌ 只能看本班</text>
    <text x="480" y="255" fill="#ef4444" font-size="10" text-anchor="middle">权限隔离要求</text>
    <rect x="395" y="275" width="170" height="38" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="480" y="292" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">❌ 审核无记录</text>
    <text x="480" y="305" fill="#ef4444" font-size="10" text-anchor="middle">事后无法追溯</text>
  </g>
  <g>
    <rect x="660" y="80" width="220" height="280" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="660" y="80" width="220" height="40" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="660" y="106" width="220" height="14" fill="#a855f7" fill-opacity="0.15"/>
    <text x="770" y="107" fill="#a855f7" font-size="14" font-weight="700" text-anchor="middle">🏫 管理员</text>
    <text x="680" y="148" fill="#94a3b8" font-size="11">• 全局学生审核</text>
    <text x="680" y="170" fill="#94a3b8" font-size="11">• 导出 CSV</text>
    <text x="680" y="192" fill="#94a3b8" font-size="11">• 全校看板</text>
    <rect x="685" y="225" width="170" height="38" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="770" y="242" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">❌ Excel 手动</text>
    <text x="770" y="255" fill="#ef4444" font-size="10" text-anchor="middle">统计耗时 2h</text>
    <rect x="685" y="275" width="170" height="38" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="770" y="292" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">❌ 操作无日志</text>
    <text x="770" y="305" fill="#ef4444" font-size="10" text-anchor="middle">无法追责审计</text>
  </g>
  <rect x="200" y="400" width="560" height="36" rx="6" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1"/>
  <text x="480" y="423" fill="#22c55e" font-size="13" font-weight="600" text-anchor="middle">✅ 一个系统，三套登录，一套审核，一张看板，完整日志</text>
</svg>
